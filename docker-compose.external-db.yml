# Same "on-prem / single-org" shape as docker-compose.yml, for a deployment pointing at a real
# MySQL server the operator already runs (a dedicated on-prem box, a managed service like RDS/
# Cloud SQL, etc.) instead of the bundled `mysql` container that file provisions. A standalone
# file rather than a docker-compose.yml override, deliberately: Compose's override-merge
# semantics for removing a service/dependency entirely (rather than just adding/changing keys)
# need a fairly recent Compose version (`!reset`), and a plain second file with no merge tricks
# needed is simpler to reason about and works on any Compose version.
#
# Used automatically by install.sh/install.ps1 when you choose "connect to your own existing
# MySQL server" during setup — see docs/DEPLOYMENT.md's "Bringing your own MySQL server" section
# for what changes vs. docker-compose.yml (in short: no `mysql` service, no `depends_on` on it,
# no `mysql-data` volume — everything else, including the migration-then-start command and every
# env var, is identical).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Kolkata}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:?CONTROL_DATABASE_URL must be set}
      DEFAULT_ORG_SLUG: ${DEFAULT_ORG_SLUG:-default}
      # Shape 2 (SaaS) only: the apex under which every workspace is a subdomain — ROOT_DOMAIN=app.example.com
      # makes acme.app.example.com resolve to org "acme", and is what the sign-in/welcome links are
      # built from. Leave unset for a single-org install. Forwarded for the same reason as
      # TENANT_DB_PROVISION_BASE_URL below: a variable set only in the host .env does not exist
      # inside the container, and a missing ROOT_DOMAIN silently turns every subdomain into the
      # default org, which looks like "login is broken for the new customer".
      ROOT_DOMAIN: ${ROOT_DOMAIN:-}
      # Only read when the trial retention programme's "Snapshot directory" is set (platform-admin
      # console -> Trial retention). Point it at a mysqldump binary if one is not on PATH inside the
      # container; without it a snapshot is recorded as "not taken", which never blocks the deletion.
      MYSQLDUMP_PATH: ${MYSQLDUMP_PATH:-}
      # Tenant-database provisioning target — see docker-compose.yml's block of the same name.
      # Unset disables the /platform-admin console's Provision button rather than guessing a server.
      TENANT_DB_PROVISION_BASE_URL: ${TENANT_DB_PROVISION_BASE_URL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      PLATFORM_ADMIN_JWT_SECRET: ${PLATFORM_ADMIN_JWT_SECRET:?PLATFORM_ADMIN_JWT_SECRET must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be set (your production domain)}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set (your production domain)}
      MAIL_FROM: ${MAIL_FROM:-Timesheet Portal <no-reply@timesheet.local>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Attachment virus scanning, off unless an admin switches it on in Ticketing settings. These
      # two have to be forwarded even though both are optional: the failure message the settings
      # page shows says "Set CLAMAV_HOST/CLAMAV_PORT", and until now there was nowhere in a
      # container to set them — an operator following that instruction would edit .env and watch
      # nothing change. Empty host leaves the service pointing at 127.0.0.1, which is the same
      # behaviour as before for anyone who never turns scanning on.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      UPLOAD_DIR: /app/uploads
      # Reverse-proxy hop count — see docker-compose.yml's block of the same name for the full
      # reasoning. Short version: the `web` container's nginx already proxies /api here, so a
      # deployment left at 0 attributes every browser request to nginx's address and turns every
      # per-IP rate limit into one shared bucket. 1 as shipped, 2 behind docker-compose.https.yml.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # SSRF guard on admin-typed outbound URLs — see docker-compose.yml and utils/egress.ts.
      ALLOW_PRIVATE_NETWORK_EGRESS: ${ALLOW_PRIVATE_NETWORK_EGRESS:-false}
      # Relocatable file storage / rotating file logs. Empty = unchanged behaviour. A path set
      # here must live inside a mounted volume, or it is written into the container's ephemeral
      # layer and lost on the next rebuild.
      STORAGE_ROOT: ${STORAGE_ROOT:-}
      STORAGE_DOCUMENTS_DIR: ${STORAGE_DOCUMENTS_DIR:-}
      STORAGE_AVATARS_DIR: ${STORAGE_AVATARS_DIR:-}
      STORAGE_FACE_DIR: ${STORAGE_FACE_DIR:-}
      LOG_DIR: ${LOG_DIR:-}
      LOG_ROTATE_HOURS: ${LOG_ROTATE_HOURS:-4}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_COMPRESS_ON_ROLLOVER: ${LOG_COMPRESS_ON_ROLLOVER:-true}
      SLA_ENABLED: ${SLA_ENABLED:-true}
      # Approval-escalation scan interval + deadline, matching docker-compose.yml.
      SLA_CRON_SCHEDULE: ${SLA_CRON_SCHEDULE:-*/15 * * * *}
      SLA_DEFAULT_APPROVAL_HOURS: ${SLA_DEFAULT_APPROVAL_HOURS:-48}
      TICKET_SLA_ENABLED: ${TICKET_SLA_ENABLED:-true}
      TICKET_SLA_CRON_SCHEDULE: ${TICKET_SLA_CRON_SCHEDULE:-*/15 * * * *}
      TICKET_SLA_LOW_HOURS: ${TICKET_SLA_LOW_HOURS:-168}
      TICKET_SLA_MEDIUM_HOURS: ${TICKET_SLA_MEDIUM_HOURS:-72}
      TICKET_SLA_HIGH_HOURS: ${TICKET_SLA_HIGH_HOURS:-24}
      TICKET_SLA_CRITICAL_HOURS: ${TICKET_SLA_CRITICAL_HOURS:-4}
      # API request telemetry (docs/DEPLOYMENT.md → "Operating API request telemetry"). Forwarded
      # explicitly like every other var here: Compose does NOT pass the host .env through to the
      # container, so a variable that is not listed simply does not exist inside it. Recording is
      # off unless API_TELEMETRY_ENABLED is set, so the defaults below are inert.
      API_TELEMETRY_ENABLED: ${API_TELEMETRY_ENABLED:-false}
      # Per-IP blanket budget. Raise for office-NAT deployments where many users share one IP.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-900}
      # Single-org stack: the code default of 5 connections/tenant is multi-tenant arithmetic.
      # Load-tested: 5 caps the authed path near 90 req/s; 20 lifts it (see config/prisma.ts).
      TENANT_DB_CONNECTION_LIMIT: ${TENANT_DB_CONNECTION_LIMIT:-20}
      API_TELEMETRY_SAMPLE_RATE: ${API_TELEMETRY_SAMPLE_RATE:-1}
      API_TELEMETRY_FLUSH_MS: ${API_TELEMETRY_FLUSH_MS:-5000}
      API_TELEMETRY_MAX_BUFFER: ${API_TELEMETRY_MAX_BUFFER:-5000}
      API_TELEMETRY_RETENTION_DAYS: ${API_TELEMETRY_RETENTION_DAYS:-14}
      # Host identity stamped on each sample. Named for the Kubernetes downward API; left empty
      # off-cluster, where the columns are written NULL rather than guessed at.
      POD_NAME: ${POD_NAME:-}
      POD_NAMESPACE: ${POD_NAMESPACE:-}
      CLUSTER_NAME: ${CLUSTER_NAME:-}
      # A fallback only — the tenant database's GlobalAISettings.apiKey wins when set.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Hourly GitHub release check. UPDATE_CHECK=off for an air-gapped install; only the literal
      # "off" disables it. UPDATE_CHECK_TOKEN is needed only for a PRIVATE repo.
      # ── Native AI (llama.cpp), docs/DEPLOYMENT.md → "Running a model on your own server" ──
      # Off unless a workspace turns it on in Workspace settings → AI; these only say WHERE the
      # pieces live when it is.
      #
      # `auto` lets the hardware probe decide whether this container may supervise its own
      # `llama-server` (it may — it is a normal Linux process) or must point at one somebody else
      # runs. Set `external` and NATIVE_AI_HOST when you run the runtime as a sidecar, which is the
      # shape to prefer once more than one API replica exists: a model loaded per replica multiplies
      # the RAM bill by the replica count, and every replica downloads its own copy of the weights.
      NATIVE_AI_RUNTIME_MODE: ${NATIVE_AI_RUNTIME_MODE:-auto}
      NATIVE_AI_SERVER_BIN: ${NATIVE_AI_SERVER_BIN:-}
      NATIVE_AI_ENGINE_RELEASE: ${NATIVE_AI_ENGINE_RELEASE:-}
      # Loopback by default. A sidecar means naming its service here — and that address is
      # unauthenticated, so it must stay on the compose network and never reach a published port.
      NATIVE_AI_HOST: ${NATIVE_AI_HOST:-127.0.0.1}
      NATIVE_AI_PORT: ${NATIVE_AI_PORT:-8080}
      # A GGUF is measured in gigabytes, so this MUST be a mounted volume. Left on the container's
      # own filesystem it is re-downloaded on every `up --build` and it inflates the writable
      # layer by the size of the weights — see `api-models` below.
      NATIVE_AI_MODEL_DIR: ${NATIVE_AI_MODEL_DIR:-/app/models}
      UPDATE_CHECK: ${UPDATE_CHECK:-on}
      UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-}
      UPDATE_CHECK_TOKEN: ${UPDATE_CHECK_TOKEN:-}
    ports:
      - "4000:4000"
    volumes:
      - api-uploads:/app/uploads
      # GGUF weights and the llama.cpp binary. Separate from uploads because the two have nothing
      # in common but a filesystem: this one is large, re-downloadable and machine-specific, and
      # somebody moving uploads to an NFS share or a backup rotation should not drag gigabytes of
      # model weights along with it.
      - api-models:/app/models
    # No `depends_on` on a bundled mysql service — there isn't one in this file. Your own MySQL
    # server is assumed already up and reachable; the migration step below fails fast (crashing
    # the container, which `restart: unless-stopped` + the installer's health-check auto-heal
    # already handle the same way they handle any other first-boot flake) if it isn't.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: sh -c "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && npx prisma migrate deploy --schema=apps/api/prisma/control/schema.prisma && node apps/api/dist/src/server.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-uploads:
  api-models:
