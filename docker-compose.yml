services:
  mysql:
    image: mysql:8.4
    command: --default-time-zone=+05:30
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-timesheet_portal}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Kolkata}
      # No fallback secrets — production refuses to boot if these aren't set.
      # Generate with: openssl rand -base64 48
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      # The control-plane database (org registry, SSO config, plan tiers, platform-admin
      # accounts) — required even for this single-org shape, see README's Multi-tenancy
      # section. A database on this same mysql container works fine.
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:?CONTROL_DATABASE_URL must be set}
      DEFAULT_ORG_SLUG: ${DEFAULT_ORG_SLUG:-default}
      # The MySQL server that new tenant databases get CREATED on when a platform admin provisions
      # an org from the /platform-admin console — a DSN with credentials but no database name.
      # Unset (the default) disables in-app provisioning, and the endpoint says so plainly rather
      # than guessing a server. Single-org installs never need it; it is forwarded because without
      # the line the variable does not exist inside the container even when the host .env sets it,
      # so the console's Provision button failed for reasons the operator could not see from here.
      TENANT_DB_PROVISION_BASE_URL: ${TENANT_DB_PROVISION_BASE_URL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      # Deliberately a separate secret from the two above — signs /platform-admin tokens only.
      PLATFORM_ADMIN_JWT_SECRET: ${PLATFORM_ADMIN_JWT_SECRET:?PLATFORM_ADMIN_JWT_SECRET must be set}
      # 32 random bytes, hex-encoded (64 hex chars). Generate with: openssl rand -hex 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be set (your production domain)}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set (your production domain)}
      MAIL_FROM: ${MAIL_FROM:-Timesheet Portal <no-reply@timesheet.local>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      UPLOAD_DIR: /app/uploads
      # Reverse-proxy hop count. NOT cosmetic: the `web` container's nginx proxies /api to this
      # service (apps/web/nginx.conf.template), so EVERY browser request already arrives through one hop.
      # At 0 the api sees nginx's address as req.ip for every caller on earth and each per-IP rate
      # limit — the 20/min login limiter above all — collapses into one shared global bucket.
      # 1 for this stack as shipped; 2 with docker-compose.https.yml (Caddy in front of nginx);
      # +1 for anything else in front (Cloudflare, a corporate LB).
      # Default stays 0 so an `./update.sh` never silently changes an existing deployment's IP
      # attribution — install.sh prompts for it, and update.sh warns when it looks wrong.
      # CAVEAT: with a hop count set, anything that can reach port 4000 DIRECTLY can forge
      # X-Forwarded-For and therefore req.ip. Bind that port to localhost (127.0.0.1:4000:4000)
      # on an exposed host so the only route in is through the proxy the count describes.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # SSRF guard on admin-typed outbound URLs (webhooks, Google Chat, Bot Framework, BYOK AI
      # base URL). false refuses private/loopback/link-local targets — above all the
      # 169.254.169.254 metadata service. Set true only for an on-prem LAN deployment whose
      # webhook receivers are genuinely internal. See utils/egress.ts.
      ALLOW_PRIVATE_NETWORK_EGRESS: ${ALLOW_PRIVATE_NETWORK_EGRESS:-false}
      # Relocatable file storage (docs/DEPLOYMENT.md → "Relocating file storage"). Empty = today's
      # layout under UPLOAD_DIR, unchanged. A path set here must live inside a mounted volume or
      # it is written into the container's ephemeral layer and lost on the next `up --build` —
      # add the bind mount to `volumes:` below at the same time.
      STORAGE_ROOT: ${STORAGE_ROOT:-}
      STORAGE_DOCUMENTS_DIR: ${STORAGE_DOCUMENTS_DIR:-}
      STORAGE_AVATARS_DIR: ${STORAGE_AVATARS_DIR:-}
      STORAGE_FACE_DIR: ${STORAGE_FACE_DIR:-}
      # Rotating file logs. Empty LOG_DIR = off (console only), which is what `docker compose logs`
      # already reads — same volume caveat as the storage paths above when you do set it.
      LOG_DIR: ${LOG_DIR:-}
      LOG_ROTATE_HOURS: ${LOG_ROTATE_HOURS:-4}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_COMPRESS_ON_ROLLOVER: ${LOG_COMPRESS_ON_ROLLOVER:-true}
      SLA_ENABLED: ${SLA_ENABLED:-true}
      # The approval-escalation scan interval and deadline. Forwarded because SLA_ENABLED alone was:
      # an operator could turn escalation off but not retune it, and the two ticket equivalents below
      # were already here — an asymmetry with no reason behind it.
      SLA_CRON_SCHEDULE: ${SLA_CRON_SCHEDULE:-*/15 * * * *}
      SLA_DEFAULT_APPROVAL_HOURS: ${SLA_DEFAULT_APPROVAL_HOURS:-48}
      TICKET_SLA_ENABLED: ${TICKET_SLA_ENABLED:-true}
      TICKET_SLA_CRON_SCHEDULE: ${TICKET_SLA_CRON_SCHEDULE:-*/15 * * * *}
      TICKET_SLA_LOW_HOURS: ${TICKET_SLA_LOW_HOURS:-168}
      TICKET_SLA_MEDIUM_HOURS: ${TICKET_SLA_MEDIUM_HOURS:-72}
      TICKET_SLA_HIGH_HOURS: ${TICKET_SLA_HIGH_HOURS:-24}
      TICKET_SLA_CRITICAL_HOURS: ${TICKET_SLA_CRITICAL_HOURS:-4}
      # API request telemetry (docs/DEPLOYMENT.md → "Operating API request telemetry"). Forwarded
      # explicitly like every other var here: Compose does NOT pass the host .env through to the
      # container, so a variable that is not listed simply does not exist inside it. Recording is
      # off unless API_TELEMETRY_ENABLED is set, so the defaults below are inert.
      API_TELEMETRY_ENABLED: ${API_TELEMETRY_ENABLED:-false}
      # Per-IP blanket budget. Raise for office-NAT deployments where many users share one IP.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-900}
      # Single-org stack: the code default of 5 connections/tenant is multi-tenant arithmetic.
      # Load-tested: 5 caps the authed path near 90 req/s; 20 lifts it (see config/prisma.ts).
      TENANT_DB_CONNECTION_LIMIT: ${TENANT_DB_CONNECTION_LIMIT:-20}
      API_TELEMETRY_SAMPLE_RATE: ${API_TELEMETRY_SAMPLE_RATE:-1}
      API_TELEMETRY_FLUSH_MS: ${API_TELEMETRY_FLUSH_MS:-5000}
      API_TELEMETRY_MAX_BUFFER: ${API_TELEMETRY_MAX_BUFFER:-5000}
      API_TELEMETRY_RETENTION_DAYS: ${API_TELEMETRY_RETENTION_DAYS:-14}
      # Host identity stamped on each sample. Named for the Kubernetes downward API; left empty
      # off-cluster, where the columns are written NULL rather than guessed at.
      POD_NAME: ${POD_NAME:-}
      POD_NAMESPACE: ${POD_NAMESPACE:-}
      CLUSTER_NAME: ${CLUSTER_NAME:-}
      # A FALLBACK only — GlobalAISettings.apiKey in the tenant database wins when set, and an
      # OpenAI-compatible provider (Ollama, Groq, OpenRouter…) is configured exclusively there.
      # There is deliberately no OPENAI_API_KEY variable anywhere in this application.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The hourly GitHub release check behind the What's-new page. UPDATE_CHECK=off is the
      # air-gapped posture: the page then lists the release history bundled in this image's own
      # CHANGELOG.md and nothing calls out. Only the literal "off" disables it — any other value,
      # including "false", leaves it on. UPDATE_CHECK_TOKEN (read-only Contents PAT) is needed only
      # when the repo is PRIVATE, where anonymous release lookups 404.
      UPDATE_CHECK: ${UPDATE_CHECK:-on}
      UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-}
      UPDATE_CHECK_TOKEN: ${UPDATE_CHECK_TOKEN:-}
    ports:
      - "4000:4000"
    volumes:
      # Persistent uploads — avatars + timesheet attachments survive container restarts.
      - api-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Run migrations as a separate step before starting the server so a failed
    # migration crashes the container instead of leaving the API partially up.
    #
    # This migrates exactly one database — DATABASE_URL — which is correct for THIS compose
    # file's deployment shape: on-prem / single-org, one Organization row (DEFAULT_ORG_SLUG)
    # pointing at this one MySQL container. A SaaS multi-org deployment has many tenant
    # databases instead, potentially on different servers than this one, so migrating "the"
    # database isn't well-defined there — that shape runs `npm run migrate:tenants` from
    # apps/api (see scripts/migrate-all-tenants.ts) against the control plane instead, as part
    # of its own deploy process, not from this file.
    # Migrates BOTH schemas — the tenant schema (this org's own data) and the control-plane
    # schema (org registry/plan tiers/platform-admin accounts), which must exist even in this
    # single-org shape. Neither step seeds data — that's a one-time bootstrap operation run
    # separately after first boot (see docs/DEPLOYMENT.md), not something to repeat every restart.
    command: sh -c "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && npx prisma migrate deploy --schema=apps/api/prisma/control/schema.prisma && node apps/api/dist/src/server.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql-data:
  api-uploads:
