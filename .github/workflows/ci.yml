name: CI

# Runs on every push and PR. Four jobs, deliberately scoped to what each platform can actually
# verify: GitHub Actions' `services:` containers (needed for a real MySQL instance) only run on
# Linux runners, so the full build+migrate+seed+Playwright pipeline runs on ubuntu-latest only.
# windows-latest still earns its place in this workflow — it's the platform install.sh/install.ps1
# and this whole codebase actually get developed on day-to-day (see docs/DEPLOYMENT.md), so a
# separate cross-platform job proves the app itself typechecks/builds cleanly there too, and a
# syntax-only pass over both installer scripts runs on the OS each one is native to.
# Test tiers run in cost order inside the ubuntu job: mocked unit tests (no DB) first for the
# fastest failure signal, then integration tests against a real MySQL, then Playwright.
on:
  push:
    # `main` ONLY (2026-10-05). Every other branch is checked on the developer's machine before it
    # leaves it — scripts/local-ci.mjs, installed as the `pre-push` hook by `npm install` — and gets CI
    # through its pull request. Pushing a branch and then fast-forwarding `main` to the same commit
    # used to run this whole workflow twice for one SHA; on a private repo that is billed minutes for
    # an answer already known. A branch that wants CI without a PR: `workflow_dispatch` on it.
    branches: ["main"]
    # NO `tags:` HERE, AND THAT IS THE SINGLE BIGGEST SAVING IN THIS FILE. A release tag points at a
    # commit that has ALREADY landed on `main` and already run everything below against that exact
    # SHA — so a tag push re-ran the whole suite for zero new information. Measured on 2026-09-28:
    # `v5.6.0` cost 120 billed minutes and `v5.7.0` another 120, out of 414 for the entire release
    # day. That is 58% of a release spent proving a green that was six minutes old.
    #
    # CD still triggers on tags (.github/workflows/cd.yml) — building and publishing the images IS
    # the thing a tag is for, and that is 3-4 minutes, not two hours.
    #
    # WHAT THIS GIVES UP, stated plainly: a tag placed on a commit that is NOT on `main` would now
    # ship without CI. The release process in CONTRIBUTING.md tags the release commit after it is on
    # `main`, and the "Every changelog version is tagged" job below still runs on `main`, so the two
    # halves stay tied together. If you ever need to validate a tag itself, `workflow_dispatch` on
    # that ref gives the full tier on demand.
    # A commit that changes only prose cannot break a build, and the cheap tier still costs ~11
    # minutes to prove it. Measured on 2026-09-24: 2 of the last 10 commits were documentation
    # only, so ~11% of the push budget was spent re-proving the same green. The account's whole
    # allowance is 2,000 minutes a month.
    #
    # `paths-ignore` skips the workflow entirely for these, so nothing is queued at all. Deliberately
    # NOT applied to `pull_request` below: a PR's checks are what somebody reads before merging, and
    # a docs PR showing no checks at all is worse than one that cost eleven minutes.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: ["**"]
  # A hand-triggered run on any branch gets the FULL tier (e2e, installer, Windows) — the way to
  # ask for the expensive jobs on a branch without a `[full-ci]` commit message.
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight. Three pushes ten minutes apart used
# to mean three complete runs; the first two answered a question nobody was still asking, at ~100
# billed minutes each. `main` and tags are exempt: a release run is never cancelled by the next.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # NOW INCLUDING `main`, which it deliberately excluded before. The old reasoning was that a
  # release run must never be cancelled by the next push. In practice releases arrive as a BURST —
  # 2026-09-28 pushed `main` three times within an hour and paid for three complete runs, of which
  # only the last described the code that shipped. The tip of `main` is what gets released, and it
  # is always the run that survives.
  #
  # What this gives up: an intermediate commit on `main` can end up with no green tick of its own.
  # That is the correct trade for a branch that is pushed in bursts — and `git bisect` over CI
  # results was never how anything here was debugged.
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

# ── The minutes budget, and where it goes ───────────────────────────────────────────────────────
#
# This repo is private, so every job minute is billed against a monthly allowance, and Windows
# minutes count double. Measured on 2026-09-21, one push cost ~104 billed minutes: four e2e shards
# (14–25 min each), the installer run (4), the Windows build (9 → 18 billed), the ubuntu
# build+unit+integration job (10) and a second ubuntu typecheck+build (5) that repeated the first.
# Three pushes a day spent the month's free allowance in ten days.
#
# So the jobs are in two tiers. The CHEAP tier — build, lint, unit, integration, and the
# syntax/manifest checks — runs on every push to every branch, because that is what catches the
# mistakes that matter most, and it costs ~11 minutes. The FULL tier — the e2e shards, the
# installer run and the Windows build — runs where a wrong answer is expensive: pushes to `main`
# and pull requests. On any other branch it runs when asked: a commit message containing
# `[full-ci]`, or a manual run from the Actions tab (`workflow_dispatch`). The local gates
# (`npm run lint`, both unit suites, the Playwright suite against the dev stack) remain the
# developer's own check before a push.
#
# ── WHERE THE MONTH ACTUALLY WENT, measured 2026-09-01..28 across all nine repositories ────────
#
#   4,412 billed minutes total, against an allowance of 2,000. 99% of it was this repository and
#   95% of THAT was this one workflow. Within it, by job:
#
#     2,350 min (53%)  the four e2e shards
#       714 min (16%)  Typecheck + build (windows)   — 415 wall-clock minutes, billed double
#       464 min (11%)  Build, typecheck, unit + integration (ubuntu)
#       179 min ( 4%)  Execute install.sh end-to-end
#
#   Three things were paying for nothing, and all three are fixed above:
#     • TAG PUSHES RE-RAN EVERYTHING against a SHA `main` had just tested — 240 minutes for two
#       tags on one day. `on.push` no longer lists tags.
#     • `main` WAS EXEMPT FROM CANCELLATION, so a burst of three pushes bought three full runs when
#       only the last one described what shipped. `cancel-in-progress` is now unconditional.
#     • EVERY PULL REQUEST RAN ALL 619 e2e TESTS, including firefox and webkit — the slowest
#       projects and the ones that answer a pre-release question, not a per-push one. Pull requests
#       now run `desktop` + `responsive-phone` (348 tests) over two shards; `main` still runs
#       everything over four.
#
#   The measurement is worth repeating before changing any gate here, rather than reasoned about:
#   list the runs, sum each job'"'"'s completed_at minus started_at, round each job UP to the minute,
#   and double anything on a windows runner. The billing API returns zeros for this account, and
#   the per-run `timing` endpoint does too, so the job timestamps are the only honest source.
#
# A job-level `if:` cannot read `env`, so the gate expression is written out on each full-tier job
# (marked "FULL TIER"); keep the copies identical.

jobs:
  build-test-ubuntu:
    name: Build, typecheck, unit + integration (ubuntu)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: ci_placeholder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: "mysql://root:root_ci_password@127.0.0.1:3306/ci_tenant"
      CONTROL_DATABASE_URL: "mysql://root:root_ci_password@127.0.0.1:3306/ci_control"
      JWT_ACCESS_SECRET: "ci-only-access-secret-not-for-real-use-0123456789"
      JWT_REFRESH_SECRET: "ci-only-refresh-secret-not-for-real-use-0123456789"
      PLATFORM_ADMIN_JWT_SECRET: "ci-only-platform-admin-secret-not-for-real-use-0123456789"
      # The control seed generates (and flags for rotation) a random bootstrap password unless one is
      # passed. CI passes the known dev value so the e2e suite's console sign-in keeps working.
      PLATFORM_ADMIN_BOOTSTRAP_PASSWORD: "PlatformAdmin@12345"
      # Exactly 64 hex characters — `env.ts` requires /^[0-9a-f]{64}$/i (32 bytes for AES-256-GCM).
      # This was 62 for as long as it has existed: two characters short, and never caught, because
      # every step that loads the app config sat behind an earlier failing gate in this same job and
      # had therefore never run. Count it if you edit it; the failure is a Zod error deep in a seed.
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      WEB_ORIGIN: "http://localhost:5173"
      APP_BASE_URL: "http://localhost:5173"
      DEFAULT_ORG_SLUG: "default"
      # Hoisted from the reporting step at the bottom of this job to JOB level on purpose: a
      # step's `if:` cannot read the `secrets` context (see that step's comment), but it CAN read
      # `env`. Mapping the secrets here is what makes that step's gate actually evaluate.
      # Unset on forks and until an admin opts in, which is precisely what the gate tests for.
      TIMESPHERE_INGEST_TOKEN: ${{ secrets.TIMESPHERE_INGEST_TOKEN }}
      TIMESPHERE_INGEST_URL: ${{ secrets.TIMESPHERE_INGEST_URL }}
      TIMESPHERE_ORG_SLUG: ${{ secrets.TIMESPHERE_ORG_SLUG }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma client code (both schemas) is generated, never checked in — `npm ci` alone
      # doesn't produce it, and `apps/api`'s own build/typecheck imports it directly
      # (`@prisma/client`, plus the control-plane client's generated path). This needs no
      # database connection, only the schema files, so it runs before Typecheck/Build below
      # rather than after — generating it any later means tsc fails on a fresh checkout with
      # "cannot find module" errors that never show up on a dev machine that already has both
      # clients generated from prior local work.
      - name: Generate Prisma clients (both schemas)
        working-directory: apps/api
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/control/schema.prisma

      # Three things, in one script: `tsc --noEmit` for apps/api, `tsc -b --noEmit` for apps/web,
      # then eslint over both plus packages/shared with the SonarJS rule set (eslint.config.mjs).
      # SonarJS is the same analyzer SonarQube runs for JS/TS, so this gate reports what the Sonar
      # dashboard would without needing a server URL or token in CI. It fails on ERRORS only —
      # the structural style rules are warnings by design, for the reasons in eslint.config.mjs and
      # sonar-project.properties. `npm ci` above installs devDependencies, which is where eslint
      # and its plugins live.
      - name: Lint (typecheck + SonarQube rules)
        run: npm run lint

      # A GATE, unlike the `npm audit` in security-scan-dogfood below — that one runs with
      # `|| true` and posts findings into the app, which is right for dogfooding but means nothing
      # ever fails on a vulnerable dependency.
      #
      # Scoped to production dependencies and to high/critical: dev-tooling advisories are frequent,
      # rarely reachable from shipped code, and a gate that cries wolf is one people learn to skip.
      #
      # Runs through scripts/audit-gate.mjs rather than `npm audit --audit-level=high` directly. A
      # bare audit can only pass or block, so the first advisory with NO AVAILABLE FIX turns it
      # permanently red — which is exactly what happened here (GHSA-ggr8-5vv4-36mx, where the latest
      # published html-to-text and @prisma/config both still require the vulnerable major). The
      # script keeps everything blocking by default and lets a reviewed advisory be accepted with
      # its reasoning written down — and fails if an accepted entry ever stops matching anything, so
      # the exception cannot outlive the problem it was written for.
      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs

      - name: Build (shared + api + web)
        run: npm run build

      # Runs before any database setup on purpose: the unit tier is fully mocked (no DB, no
      # network, no LLM/Stripe calls), so it's the fastest signal in the pipeline and shouldn't
      # wait behind migrate/seed to tell you something's broken.
      - name: Unit tests (vitest)
        run: npm run test -w apps/api

      # The web workspace's own unit tests. Currently one file, and it earns the step on its own:
      # src/lib/safe-html.ts is the ONLY sanitizer for two of its callers (Ask AI's model-authored
      # markdown, and the What's-new page's release notes fetched from GitHub), so a regression
      # there is an XSS/UI-redress hole with nothing else behind it. Needs a DOM, which is why it
      # cannot live in the api project — see apps/web/vitest.config.ts.
      - name: Unit tests — web (vitest, jsdom)
        run: npm run test -w apps/web

      # The web container's nginx config is a TEMPLATE rendered at container start, so a malformed
      # directive does not fail here — it crash-loops the pod at deploy time with the reason buried
      # in container logs. Render it exactly as the image's entrypoint does and let nginx parse it.
      #
      # The `grep -q` is not padding: a bind-mount or path mistake silently leaves the image's own
      # stock default.conf in place, and `nginx -t` then reports "syntax is ok" for a file that is
      # not ours at all. Asserting a directive that only this template carries is what makes the
      # step's success mean something. (That exact false pass happened once during review.)
      - name: Validate the web nginx template
        run: |
          docker run --rm \
            -e API_UPSTREAM=127.0.0.1:4000 -e CSP_CONNECT_SRC="" \
            -v "$PWD/apps/web/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            --entrypoint sh nginx:1.27-alpine -c '
              /docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null 2>&1
              grep -q "Content-Security-Policy" /etc/nginx/conf.d/default.conf \
                || { echo "::error::rendered conf is missing our CSP — the template was not applied"; exit 1; }
              grep -q "frame-ancestors" /etc/nginx/conf.d/default.conf \
                || { echo "::error::CSP rendered without frame-ancestors"; exit 1; }
              nginx -t
            '

      - name: Create CI databases
        run: |
          mysql -h127.0.0.1 -uroot -proot_ci_password -e "CREATE DATABASE IF NOT EXISTS ci_tenant; CREATE DATABASE IF NOT EXISTS ci_control;"

      - name: Migrate both schemas
        working-directory: apps/api
        run: |
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/control/schema.prisma

      - name: Seed tenant + control-plane data
        working-directory: apps/api
        run: |
          npx tsx prisma/seed.ts
          npx tsx prisma/control/seed.ts

      # The integration tier derives its own throwaway `<db>_test` databases from
      # DATABASE_URL/CONTROL_DATABASE_URL and creates/migrates/seeds/drops them itself, so it
      # needs the MySQL service above but deliberately never touches the ci_tenant/ci_control
      # databases the Playwright suite runs against.
      - name: Integration tests (vitest, real MySQL)
        run: npm run test:integration -w apps/api

      # Reports this job's own outcome as a TestRun through the app's own ingestion webhook
      # (devops-webhook.controller.ts — the same endpoint docs/SECURITY_DEVOPS_INTEGRATIONS.md
      # tells CUSTOMERS to POST to). `job.status` reflects this job's status up to this point
      # even inside an `always()` step, same pattern as a Slack-on-failure notification step.
      # Skipped entirely until TIMESPHERE_INGEST_TOKEN is configured (see security-scan-dogfood
      # job below for the one-time setup), so this is a no-op on forks/until an admin opts in.
      #
      # The gate reads `env`, NOT `secrets`, and that distinction is load-bearing: GitHub does not
      # expose the `secrets` context to any `if:` key (job or step — only github/needs/vars/inputs
      # at job level, plus env/matrix/steps at step level). A `secrets.X != ''` condition therefore
      # resolves the context to empty and compares '' != '', which is FALSE — so the previous
      # version of this gate skipped this step unconditionally, including for the admin who had
      # just configured the token. The secrets are mapped into job-level `env` above instead.
      - name: Report test-run status to TimeSphere
        if: always() && env.TIMESPHERE_INGEST_TOKEN != ''
        run: |
          STATUS="PASSED"
          if [ "${{ job.status }}" != "success" ]; then STATUS="FAILED"; fi
          curl -sf -X POST "$TIMESPHERE_INGEST_URL/api/devops/$TIMESPHERE_ORG_SLUG/test-runs" \
            -H "Authorization: Bearer $TIMESPHERE_INGEST_TOKEN" -H "Content-Type: application/json" \
            --data "{\"provider\":\"github-actions\",\"branch\":\"${{ github.ref_name }}\",\"status\":\"$STATUS\"}" \
            || echo "::warning::Failed to report test-run status to TimeSphere (non-fatal)"

  # ── The Playwright suite, split across parallel runners ──────────────────────────────────────
  #
  # WHY THIS IS ITS OWN JOB, AND SHARDED. It used to be the last step of the job above, and it was
  # 94% of that job's wall clock: 71 minutes out of 75, with everything else — install, lint, audit,
  # build, unit, migrate, seed, integration — adding up to 4½.
  #
  # Sharding is safe here for a specific reason. `playwright.config.ts` pins `workers: 1` and
  # `fullyParallel: false` because specs share one seeded database and would race each other. A
  # SHARD is not a worker: each one is a separate runner with its own MySQL service, its own seed
  # and its own `webServer` pair, so the no-concurrency guarantee still holds INSIDE a shard while
  # the shards themselves run side by side. Raising `workers` instead would break exactly the thing
  # that comment protects.
  #
  # `fail-fast: false` because a failure in shard 2 says nothing about shard 3, and cancelling the
  # others would hide two thirds of the picture on the run you most need it.
  #
  # TWO SIZES, BECAUSE e2e IS 53% OF THE ENTIRE ACTIONS BILL. Measured 2026-09-01..28: 2,350 of
  # 4,412 billed minutes were these four shards. Running the same 619 tests on every pull-request
  # push is what made that number, and most of those pushes are not the one that ships.
  #
  #   FULL  (main, or `[full-ci]`)  — 4 shards, every project: 279 desktop + 32 firefox + 32 webkit
  #                                   + 4 x 69 responsive = 619 tests. This is what gates a release.
  #   LIGHT (pull requests, dispatch) — 2 shards, `desktop` + `responsive-phone` = 348 tests.
  #
  # WHY THOSE TWO PROJECTS AND NOT JUST `desktop`. `desktop` is the body of the suite, and
  # `responsive-phone` is the width where layout bugs actually bite — the CI-only overflow failures
  # this repo has had were all found at 390px, never at 1920. Dropping firefox and webkit is where
  # the time goes: they are 64 tests but the SLOWEST, webkit measured at 1.67x firefox on the same
  # specs, and they are cross-browser smoke — the question you want answered before a release, not
  # on every push to a branch.
  #
  # AND TWO SHARDS, NOT FOUR, FOR THE LIGHT TIER. Each shard pays ~5 minutes of fixed cost before it
  # runs a single test (checkout, install, Prisma generate, MySQL, migrate, seed, browsers). Four
  # shards of a half-sized suite spend more on setup than they save in parallelism.
  e2e:
    name: e2e ${{ matrix.shard }}/${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]')) && '4' || '2' }}
    runs-on: ubuntu-latest
    # FULL TIER — see the budget note at the top.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # `strategy` cannot read `env`, so the FULL/LIGHT condition is spelled out here and again in
        # the run step below. They must agree: a 4-entry matrix running `--shard=n/2` would execute
        # shards 3 and 4 against a two-way split and silently test nothing. The step derives its
        # `--shard` denominator from this same expression for that reason.
        shard: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]')) && '[1,2,3,4]' || '[1,2]') }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: ci_placeholder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: "mysql://root:root_ci_password@127.0.0.1:3306/ci_tenant"
      CONTROL_DATABASE_URL: "mysql://root:root_ci_password@127.0.0.1:3306/ci_control"
      JWT_ACCESS_SECRET: "ci-only-access-secret-not-for-real-use-0123456789"
      JWT_REFRESH_SECRET: "ci-only-refresh-secret-not-for-real-use-0123456789"
      PLATFORM_ADMIN_JWT_SECRET: "ci-only-platform-admin-secret-not-for-real-use-0123456789"
      # The control seed generates (and flags for rotation) a random bootstrap password unless one is
      # passed. CI passes the known dev value so the e2e suite's console sign-in keeps working.
      PLATFORM_ADMIN_BOOTSTRAP_PASSWORD: "PlatformAdmin@12345"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      WEB_ORIGIN: "http://localhost:5173"
      APP_BASE_URL: "http://localhost:5173"
      DEFAULT_ORG_SLUG: "default"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients (both schemas)
        working-directory: apps/api
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/control/schema.prisma

      # packages/shared must be built before the dev servers can resolve it; the API and web run
      # from source via their own dev servers (playwright.config.ts's `webServer`), so this is the
      # only build the suite needs.
      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Create CI databases
        run: mysql -h127.0.0.1 -uroot -proot_ci_password -e "CREATE DATABASE IF NOT EXISTS ci_tenant; CREATE DATABASE IF NOT EXISTS ci_control;"

      - name: Migrate both schemas
        working-directory: apps/api
        run: |
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/control/schema.prisma

      - name: Seed tenant + control-plane data
        working-directory: apps/api
        run: |
          npx tsx prisma/seed.ts
          npx tsx prisma/control/seed.ts

      # Keyed on the resolved Playwright version, so a dependency bump invalidates it automatically
      # rather than silently reusing browsers built for a different client.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Browsers only on a cache miss. The OS libraries are installed either way, because they
      # live in /usr/lib rather than in the cached ~/.cache/ms-playwright — restoring the cache
      # alone would leave browser binaries that cannot start for want of a shared object.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run e2e suite
        # The denominator and the project list both come from FULL, which is the same expression the
        # matrix above uses — see the note there for why it is written twice.
        env:
          CI: "true"
          FULL: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]') }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "FULL tier: every project, shard ${{ matrix.shard }} of 4"
            npm run test:e2e -- --shard=${{ matrix.shard }}/4
          else
            echo "LIGHT tier: desktop + responsive-phone, shard ${{ matrix.shard }} of 2"
            echo "  (firefox, webkit and the tablet/laptop/4k widths run on main — or add [full-ci] to this commit)"
            npm run test:e2e -- --project=desktop --project=responsive-phone --shard=${{ matrix.shard }}/2
          fi

      # Artifact storage is billed too, and this was most of that bill: a failing shard's report
      # weighed 25–32 MB, almost all of it failure VIDEOS (a .webm per attempt), kept for 14 days,
      # three shards at a time. The config now records no video in CI — the retry's trace carries
      # the DOM, network and per-action screenshots a video cannot, at a tenth of the size (see
      # playwright.config.ts) — and three days is longer than anyone has waited to look at one.
      - name: Upload Playwright report
        if: failure()
        # NEVER fails the job. When the account's artifact storage is full the upload errors with
        # "Artifact storage quota has been hit", and because that step ran inside the e2e job it
        # turned into a second, louder red X on a job that had already reported exactly which test
        # failed. Worse, it meant the trace for that failure was never stored — so the only record
        # of WHY a test failed was the one thing the quota had just thrown away. A diagnostic that
        # can break the diagnosis is worse than no diagnostic.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          # Per-shard name: four jobs uploading one artifact name is a 409 on the second.
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 3
          compression-level: 9

  # Exists solely to answer "is ingestion configured?" as a job OUTPUT, because a job-level `if:`
  # is the one place that question cannot be asked directly — `secrets` is unavailable there, and
  # unlike a step's `if:` there is no `env` context to fall back on either. `needs.<job>.outputs`
  # IS readable from a job-level `if:`, so one trivial job converts the secret's presence into
  # something the gate below can legally see. This is the documented workaround, not a trick.
  #
  # The token's VALUE never leaves this job — only the string "true"/"false" does.
  ingest-configured:
    name: Check whether TimeSphere ingestion is configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TIMESPHERE_INGEST_TOKEN: ${{ secrets.TIMESPHERE_INGEST_TOKEN }}
        run: |
          if [ -n "$TIMESPHERE_INGEST_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "TIMESPHERE_INGEST_TOKEN is not set — the security dogfooding job will be skipped."
          fi

  # Dogfoods TimeSphere's own ingest-only security pipeline against its own source — the exact
  # endpoints docs/SECURITY_DEVOPS_INTEGRATIONS.md documents for customers, exercised for real
  # here for the first time. Entirely opt-in: skipped whole-job until an admin generates an
  # ingestion token (Workspace Settings -> Security -> CI/CD ingestion -> rotate token) and adds
  # it plus the target host/org as repo secrets (TIMESPHERE_INGEST_TOKEN/_URL/_ORG_SLUG) — so
  # this is a safe no-op on every fork and on this repo until someone deliberately turns it on.
  # `continue-on-error: true` because this job's whole point is informational dogfooding, not a
  # merge gate — a scanner hiccup or a real finding must never block a PR.
  security-scan-dogfood:
    name: Dogfood security scanning (SAST + SCA + SBOM)
    runs-on: ubuntu-latest
    # Gated on the preflight job's OUTPUT rather than `secrets.…` directly. The previous
    # `if: ${{ secrets.TIMESPHERE_INGEST_TOKEN != '' }}` looked correct and was silently always
    # false — GitHub does not expose `secrets` to a job-level `if:`, so the expression compared an
    # empty context value against '' and skipped this job on every run, token configured or not.
    # This entire pipeline had therefore never executed once. See the ingest-configured job above.
    needs: ingest-configured
    if: needs.ingest-configured.outputs.configured == 'true'
    continue-on-error: true
    env:
      TIMESPHERE_INGEST_TOKEN: ${{ secrets.TIMESPHERE_INGEST_TOKEN }}
      TIMESPHERE_INGEST_URL: ${{ secrets.TIMESPHERE_INGEST_URL }}
      TIMESPHERE_ORG_SLUG: ${{ secrets.TIMESPHERE_ORG_SLUG }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- SAST: CodeQL, output kept local (upload: false) since results go to TimeSphere, not
      #     GitHub's own code-scanning tab — this repo may not have GitHub Advanced Security.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          upload: false

      - name: Post CodeQL findings to TimeSphere
        run: |
          shopt -s nullglob
          for f in codeql-results/*.sarif; do
            curl -sf -X POST "$TIMESPHERE_INGEST_URL/api/devops/$TIMESPHERE_ORG_SLUG/findings/sarif?type=SAST&repository=$REPO&branch=$BRANCH" \
              -H "Authorization: Bearer $TIMESPHERE_INGEST_TOKEN" -H "Content-Type: application/json" \
              --data @"$f" || echo "::warning::Failed to post CodeQL SARIF ($f) to TimeSphere (non-fatal)"
          done

      # --- SAST: Semgrep's free ruleset, the exact tool docs/SECURITY_DEVOPS_INTEGRATIONS.md
      #     already documents as the canonical example — this makes that example a proven one.
      - name: Run Semgrep
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep --config auto --sarif --output /src/semgrep.sarif /src || true

      - name: Post Semgrep findings to TimeSphere
        run: |
          if [ -f semgrep.sarif ]; then
            curl -sf -X POST "$TIMESPHERE_INGEST_URL/api/devops/$TIMESPHERE_ORG_SLUG/findings/sarif?type=SAST&repository=$REPO&branch=$BRANCH" \
              -H "Authorization: Bearer $TIMESPHERE_INGEST_TOKEN" -H "Content-Type: application/json" \
              --data @semgrep.sarif || echo "::warning::Failed to post Semgrep SARIF to TimeSphere (non-fatal)"
          fi

      # --- SSCT: npm audit has no SARIF output, so a small mapper translates it to the native
      #     findings-batch shape (scripts/ci/npm-audit-to-findings.mjs).
      - name: Run npm audit
        run: npm audit --json > npm-audit.json || true

      - name: Map and post npm audit findings to TimeSphere
        run: |
          node scripts/ci/npm-audit-to-findings.mjs npm-audit.json "$REPO" "$BRANCH" > npm-audit-findings.json
          if [ -s npm-audit-findings.json ] && [ "$(node -e "console.log(JSON.parse(require('fs').readFileSync('npm-audit-findings.json','utf8')).findings.length)")" != "0" ]; then
            curl -sf -X POST "$TIMESPHERE_INGEST_URL/api/devops/$TIMESPHERE_ORG_SLUG/findings" \
              -H "Authorization: Bearer $TIMESPHERE_INGEST_TOKEN" -H "Content-Type: application/json" \
              --data @npm-audit-findings.json || echo "::warning::Failed to post npm audit findings to TimeSphere (non-fatal)"
          fi

      # --- SBOM: a real dependency inventory, not a stub — feeds the app's own SBOM inventory
      #     report the moment it's ingested.
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json || true

      - name: Post SBOM to TimeSphere
        run: |
          if [ -f sbom.json ]; then
            curl -sf -X POST "$TIMESPHERE_INGEST_URL/api/devops/$TIMESPHERE_ORG_SLUG/sbom?repository=$REPO" \
              -H "Authorization: Bearer $TIMESPHERE_INGEST_TOKEN" -H "Content-Type: application/json" \
              --data @sbom.json || echo "::warning::Failed to post SBOM to TimeSphere (non-fatal)"
          fi

  # Windows only, and FULL TIER only. The matrix used to include ubuntu-latest as well, which
  # repeated the lint and build the job at the top of this file had already run on the same
  # commit — five minutes per push proving what was proven. Windows is the platform this codebase
  # is developed on (see the header comment) and the one that can differ, so it stays; at
  # double-billed minutes it runs on the full tier, and a branch push relies on the developer's
  # own Windows build, which is where the branch was built in the first place.
  build-cross-platform:
    name: Typecheck + build (${{ matrix.os }})
    # NARROWER THAN THE REST OF THE FULL TIER, and measured: this job takes 8 minutes and Windows
    # bills at DOUBLE, so it is 16 of the ~97 equivalent minutes a full run costs — 16% of the
    # bill for a typecheck-and-build that has never once caught something the ubuntu job missed.
    # What it genuinely protects against is a platform break (path handling, case sensitivity, line
    # endings), and those reach a user through a RELEASE, not through a branch. So it runs on main,
    # on tags, and on demand — not on every pull request or dispatched branch run.
    #
    # If you are about to change something platform-shaped and want it checked early, say so:
    # `[full-ci]` in the commit message still brings it in.
    if: ${{ github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    # `prisma generate` (below) doesn't connect to a database, but it does validate that the
    # schema's referenced env vars are at least defined — this job never touches a real MySQL
    # instance, so these are unused placeholder values, just enough to satisfy that check.
    env:
      DATABASE_URL: "mysql://unused:unused@localhost:3306/unused"
      CONTROL_DATABASE_URL: "mysql://unused:unused@localhost:3306/unused"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same reason as the ubuntu job above — tsc needs the generated Prisma clients to
      # resolve `@prisma/client`'s types before it can typecheck/build apps/api at all.
      - name: Generate Prisma clients (both schemas)
        working-directory: apps/api
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/control/schema.prisma

      - name: Lint (typecheck + SonarQube rules)
        run: npm run lint

      - name: Build (shared + api + web)
        run: npm run build

  validate-installers:
    name: Validate installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax-check install.sh and update.sh (bash -n, no execution)
        run: bash -n install.sh && bash -n update.sh

  # The deployment manifests had no CI coverage at all until now, and the two things this job
  # checks are both things that had ALREADY silently drifted by the time it was written: the Helm
  # chart's appVersion sat at 2.1.0 while the repo shipped 2.4.0, and nothing rendered the chart
  # to prove its templates still produce valid YAML. Neither failure breaks a build, which is
  # exactly why only a check can catch them.
  #
  # Everything here is offline rendering and parsing — `helm template` and `docker compose config`
  # resolve manifests locally and talk to no cluster, no registry, and no daemon. There is
  # deliberately no `helm install`, no `docker compose up`, and no push anywhere.
  # CHANGELOG.md opens by promising that "each version corresponds to a git tag vX.Y.Z and a GitHub
  # Release whose body is copied from the matching section here". Nothing enforced it, and by 5.1.1
  # that promise was false for ELEVEN of forty versions — three with no tag at all, eight more tagged
  # but never released. None of it is visible from inside the repository: the changelog reads
  # perfectly, the tests pass, and the gap only exists on GitHub.
  #
  # `fetch-tags` is why this is its own job. Checkout does not fetch tags by default, and turning it
  # on for the heavy jobs would slow every one of them down for a check that costs two seconds here.
  verify-release-tags:
    name: Every changelog version is tagged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Each released version in CHANGELOG.md must have a matching tag
        run: |
          missing=""
          # The Unreleased section has no version number, on purpose, so this pattern skips it.
          for version in $(grep -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/^## //'); do
            if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              missing="$missing v$version"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md documents versions with no git tag:$missing. PUSH THE TAG IN THE SAME COMMAND AS THE BRANCH \"git push origin main v${missing# v}\" so the tag already exists when this job runs. Pushing them separately leaves this run red until the next push to main, because a workflow run belongs to one ref and the tag push no longer starts a CI run of its own. Or take the section out of the changelog."
            exit 1
          fi
          echo "Every documented version has a tag."

  validate-deployment-manifests:
    name: Validate Helm chart + compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # The label a cluster reports as app.kubernetes.io/version comes from Chart.yaml's
      # appVersion, so a stale value makes `kubectl get deploy -L app.kubernetes.io/version` lie
      # about what is running. Cheap to assert, invisible to every other kind of test.
      - name: Chart appVersion must match the repo VERSION file
        run: |
          repo_version="$(tr -d ' \t\n\r' < VERSION)"
          chart_appversion="$(grep -E '^appVersion:' deploy/helm/timesphere/Chart.yaml | sed -E 's/^appVersion:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')"
          echo "VERSION=$repo_version  Chart.yaml appVersion=$chart_appversion"
          if [ "$repo_version" != "$chart_appversion" ]; then
            echo "::error file=deploy/helm/timesphere/Chart.yaml::appVersion ($chart_appversion) does not match the repo VERSION ($repo_version). Bump appVersion (and the chart's own version:) when cutting a release."
            exit 1
          fi

      - name: helm lint
        run: helm lint deploy/helm/timesphere

      # Rendered THREE ways, because the chart's real branches are its conditionals and a single
      # default render walks past most of them: bundled MySQL + migration hook Job (the evaluation
      # path), external MySQL with the hook disabled (the recommended production path), and
      # telemetry on (which is what adds the downward-API env block to the api Deployment).
      # Piped through a strict YAML parse — `helm template` happily emits text that is not valid
      # YAML when an indentation helper is wrong, and only parsing it proves otherwise.
      - name: helm template (default values — bundled MySQL)
        run: helm template ts deploy/helm/timesphere > /tmp/render-default.yaml

      - name: helm template (external MySQL, no migration hook)
        run: |
          helm template ts deploy/helm/timesphere \
            --set mysql.enabled=false \
            --set migrationJob.enabled=false \
            --set ingress.enabled=false > /tmp/render-external.yaml

      - name: helm template (telemetry + vertical autoscaling on)
        run: |
          helm template ts deploy/helm/timesphere \
            --set telemetry.enabled=true \
            --set api.verticalAutoscaling.enabled=true \
            --set ingress.wildcardHost='*.timesphere.example.com' > /tmp/render-telemetry.yaml

      # Native AI, rendered BOTH ways, because its two modes produce different manifests and the
      # three renders above walk past both of them: `embedded` adds a second PersistentVolumeClaim
      # and a volume mount on the api Deployment, `external` adds neither and only sets two env
      # keys. A chart branch nothing renders is a chart branch nobody knows is broken.
      - name: helm template (native AI, embedded runtime)
        run: |
          helm template ts deploy/helm/timesphere \
            --set nativeAi.enabled=true \
            --set nativeAi.mode=embedded \
            --set api.replicaCount=1 \
            --set api.autoscaling.enabled=false > /tmp/render-native-embedded.yaml
          grep -q "api-models" /tmp/render-native-embedded.yaml \
            || { echo "::error::embedded native AI rendered no models PVC"; exit 1; }

      - name: helm template (native AI, external runtime)
        run: |
          helm template ts deploy/helm/timesphere \
            --set nativeAi.enabled=true \
            --set nativeAi.host=llama-server > /tmp/render-native-external.yaml
          grep -q "NATIVE_AI_HOST" /tmp/render-native-external.yaml \
            || { echo "::error::external native AI rendered no runtime address"; exit 1; }
          if grep -q "api-models" /tmp/render-native-external.yaml; then
            echo "::error::external native AI must not claim a models volume — nothing local runs the model"
            exit 1
          fi

      # `helm template` will happily emit text that is not valid YAML when an indentation helper is
      # wrong (a missing `nindent`, a `with` block off by two spaces) — helm itself does not parse
      # what it prints. Only loading each render proves the chart produces manifests the API server
      # would accept. PyYAML is installed explicitly rather than assumed: it happens to be present
      # on today's ubuntu runner image as a transitive dependency, which is not a contract.
      - name: Every render must parse as YAML
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import glob, yaml
          total = 0
          for path in sorted(glob.glob("/tmp/render-*.yaml")):
              docs = [d for d in yaml.safe_load_all(open(path, encoding="utf-8")) if d]
              kinds = sorted({d.get("kind", "?") for d in docs})
              print(f"{path}: {len(docs)} documents -> {', '.join(kinds)}")
              total += len(docs)
          # A render that silently produced nothing would otherwise "pass" this check.
          assert total > 0, "helm template produced no manifests at all"
          PY

      # Validates all three compose SHAPES, not just the default one install.sh exercises below.
      # The https overlay and the external-db file are the two an install-e2e run never touches,
      # so a broken key in either used to be discoverable only by a customer choosing that path.
      # `config` resolves and type-checks the merged model without starting anything.
      - name: docker compose config (all three shapes)
        run: |
          cat > /tmp/compose-validate.env <<'EOF'
          MYSQL_ROOT_PASSWORD=validate-only
          DATABASE_URL=mysql://root:validate-only@mysql:3306/timesheet_portal
          CONTROL_DATABASE_URL=mysql://root:validate-only@mysql:3306/timesphere_control
          JWT_ACCESS_SECRET=validate-only-access-secret-0123456789
          JWT_REFRESH_SECRET=validate-only-refresh-secret-0123456789
          PLATFORM_ADMIN_JWT_SECRET=validate-only-platform-secret-0123456789
          ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          WEB_ORIGIN=https://timesphere.example.com
          APP_BASE_URL=https://timesphere.example.com
          EOF
          docker compose --env-file /tmp/compose-validate.env -f docker-compose.yml config >/dev/null
          docker compose --env-file /tmp/compose-validate.env -f docker-compose.yml -f docker-compose.https.yml config >/dev/null
          docker compose --env-file /tmp/compose-validate.env -f docker-compose.external-db.yml config >/dev/null
          echo "All three compose shapes resolve."

  # The syntax check above catches typos; it cannot catch installer ROT — a compose key that
  # drifted, a seed script that moved, a verification endpoint that changed shape. Only running
  # the installer the way a customer does proves it still installs, so this executes install.sh
  # end-to-end on the runner: real Docker build, real MySQL container, real migrations and seed,
  # and the installer's own verification suite (health, version, migration status, seeded
  # platform-admin login, SPA served) as the pass/fail signal. TS_AUTO=1 answers every prompt
  # with its defaults — the same non-interactive mode fleet scripts use, so CI exercises it too.
  install-e2e:
    name: Execute install.sh end-to-end
    runs-on: ubuntu-latest
    # FULL TIER — a real Docker build of both images per run; see the budget note at the top.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Run the installer exactly as a customer would
        run: TS_AUTO=1 ./install.sh

      - name: Show container state on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps || true
          docker compose -f docker-compose.yml logs --tail=200 api || true

  validate-installer-windows:
    name: Validate install.ps1 (PowerShell parser, no execution)
    runs-on: windows-latest
    # RELEASE TIER, same as build-cross-platform above and for the same reason: it is a Windows
    # runner, so every minute bills as two, and what it protects is a script that reaches a user
    # through a release. It used to run on EVERY push, which was the outlier this replaced:
    # on a runner billed at twice the Linux rate, to PARSE two files that change a few times a year.
    # Measured over 2026-08-25..09-24: 922 Windows minutes, which count as 1,844 against the
    # allowance — 17% of the month's total for a syntax check. It still runs before anything
    # reaches main or a tag, which is every path by which an installer script can reach a customer;
    # a broken `install.ps1` sitting on a feature branch for an hour harms nobody. `[full-ci]` in a
    # commit message still pulls it in early when you are actually editing the installers.
    if: ${{ github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse install.ps1 without running it (PowerShell 7 / pwsh)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile("update.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly under pwsh."

      # Deliberately a SEPARATE step from the pwsh one above, using `shell: powershell`
      # (Windows PowerShell 5.1, the OS-bundled default every real end-user actually runs this
      # script with — see docs/INSTALLATION.md's own "PowerShell 5.1+ (built in)" prerequisite)
      # rather than pwsh (PowerShell 7/Core). The two engines default to different text
      # encodings for a BOM-less script file — pwsh assumes UTF-8, Windows PowerShell 5.1
      # assumes the system codepage — so a non-ASCII character (an em-dash, a smart quote) in a
      # BOM-less .ps1 file can parse perfectly under pwsh while genuinely failing to parse under
      # powershell.exe. That exact gap let install.ps1 ship with a real parse error invisible to
      # this job until someone actually ran it with plain `powershell.exe` — see install.ps1's
      # own file-encoding fix (UTF-8 BOM) for the concrete case this step now guards against.
      - name: Parse install.ps1 without running it (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly under Windows PowerShell 5.1."
