name: CD — Build & Publish Images

# Builds apps/api and apps/web's Docker images (unchanged Dockerfiles — see apps/api/Dockerfile,
# apps/web/Dockerfile) and pushes them to GHCR using the repo's own GITHUB_TOKEN, so this works
# out of the box with zero external registry account setup. Swapping to another registry (ECR/
# GCR/ACR/Docker Hub) is a matter of changing `env.REGISTRY` and the login step's credentials —
# see docs/DEPLOYMENT.md's CI/CD section.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # A docs-only commit produces byte-identical images; rebuilding them bought nothing. GitHub does
    # not evaluate path filters for tag pushes, so a release tag always builds.
    paths-ignore:
      - "docs/**"
      # Named one by one, NOT "**/*.md": CHANGELOG.md is copied into the API image (What's new reads
      # it), so a changelog-only commit must rebuild.
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".env.example"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ghcr-retention.yml"

# A newer push to `main` supersedes an in-flight build of an older one: only the tip becomes `latest`.
# Tags each get their own group (the ref), so a release build is never cancelled.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}-api
  IMAGE_WEB: ${{ github.repository }}-web

jobs:
  publish:
    name: Build & push (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.component == 'api' && env.IMAGE_API || env.IMAGE_WEB }}
          # Two tags, not three. A `sha-<commit>` tag used to be added on every push to `main`,
          # which on a private registry meant every merge left two more image versions (api and
          # web, a few hundred MB together) that nothing referenced and nothing ever removed —
          # the package storage bill, in full. `latest` moves with `main`; a version tag gets its
          # semver. A deployment that wants to pin a commit pins the semver, which IS a commit.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Identity stamps — src/config/version.ts reads these inside the container, where there
          # is no .git to derive them from. The semver itself travels as the COPY'd VERSION file,
          # so it stays correct even for a bare local `docker build` with no args.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.created_at }}
          # Layer cache: READ from wherever it is, WRITE only from `main`. GitHub's cache is scoped
          # to the ref that wrote it, so a build on a version tag that also wrote its layers left
          # ~600 MB under a ref that will never build again — three releases in one afternoon
          # filled the 10 GB cache with dead layers and evicted the Playwright browsers CI relies
          # on. Tag builds still restore from `main`'s layers, which is where they came from.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', matrix.component) || '' }}

  # THERE IS NO PRUNE JOB HERE ANY MORE, AND THAT IS DELIBERATE. READ THIS BEFORE ADDING ONE BACK.
  #
  # A job using `actions/delete-package-versions` with `delete-only-untagged-versions: true` lived
  # here from 2026-09-21. It never ran — no release was cut between then and 2026-09-24 — which is
  # the only reason this repository still has its release images.
  #
  # "Untagged" does not mean "unreferenced". buildx pushes each release as an OCI *index*, and that
  # index's children — the linux/amd64 image itself, and the provenance attestation buildx attaches
  # by default — are separate package versions that carry NO tag of their own. They are indexed by
  # digest from the tagged parent. Measured against this registry on 2026-09-24: of 675 untagged
  # versions across the two packages, 558 were children of a tagged release. Deleting the untagged
  # set would have destroyed every `docker pull ghcr.io/.../timesheet-api:<version>` from 2.0.0 to
  # 5.5.0 while reporting success, because the tag would survive with nothing underneath it.
  #
  # The actual storage problem was never the untagged versions. It was `type=sha,format=long`
  # tagging every commit as its own image — 193 of them, each with two children. That tag was
  # removed from the metadata step above in the same change, so the growth has stopped at source,
  # and the 696 historical residue versions were deleted by hand on 2026-09-24 after checking every
  # tagged manifest to see which digests it referenced.
  #
  # If a prune is ever wanted again it must resolve each tagged index's children FIRST and exclude
  # them — see the method in docs/DEPLOYMENT.md. An off-the-shelf "delete untagged" action cannot
  # do that and must not be used here.
