name: CD — Build & Publish Images

# Builds apps/api and apps/web's Docker images (unchanged Dockerfiles — see apps/api/Dockerfile,
# apps/web/Dockerfile) and pushes them to GHCR using the repo's own GITHUB_TOKEN, so this works
# out of the box with zero external registry account setup. Swapping to another registry (ECR/
# GCR/ACR/Docker Hub) is a matter of changing `env.REGISTRY` and the login step's credentials —
# see docs/DEPLOYMENT.md's CI/CD section.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}-api
  IMAGE_WEB: ${{ github.repository }}-web

jobs:
  publish:
    name: Build & push (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.component == 'api' && env.IMAGE_API || env.IMAGE_WEB }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Identity stamps — src/config/version.ts reads these inside the container, where there
          # is no .git to derive them from. The semver itself travels as the COPY'd VERSION file,
          # so it stays correct even for a bare local `docker build` with no args.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.created_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
