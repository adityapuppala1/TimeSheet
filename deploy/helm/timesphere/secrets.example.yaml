# NOT a chart template (it deliberately lives outside templates/, so `helm install` never
# renders or applies it). Copy this file, fill in real values, and apply it yourself with
# `kubectl apply -f` BEFORE installing the chart - Secret creation stays out of `helm install`
# on purpose (see values.yaml's existingSecretName comment) so long-lived credentials never end
# up in a `helm history`/`helm get values` snapshot.
#
# Generate strong values the same way docs/DEPLOYMENT.md and install.sh do:
#   openssl rand -base64 48   -> JWT_ACCESS_SECRET / JWT_REFRESH_SECRET / PLATFORM_ADMIN_JWT_SECRET
#   openssl rand -hex 32      -> ENCRYPTION_KEY / MYSQL_ROOT_PASSWORD
#
# For a real production cluster, prefer a proper secret manager (sealed-secrets, External
# Secrets Operator + your cloud's secret store, HashiCorp Vault) over a plain kubectl apply -
# this file is the fastest path to a working first deployment, not the hardened end state.
apiVersion: v1
kind: Secret
metadata:
  name: timesphere-secrets
type: Opaque
stringData:
  # mysql.enabled=true (this chart's own MySQL) - point at the in-cluster service DNS name,
  # "<release-name>-timesphere-mysql". mysql.enabled=false (external managed MySQL) - point at
  # that instance's real host/port instead.
  DATABASE_URL: "mysql://root:CHANGE_ME@release-name-timesphere-mysql:3306/timesheet_portal"
  CONTROL_DATABASE_URL: "mysql://root:CHANGE_ME@release-name-timesphere-mysql:3306/timesphere_control"
  # Only needed if you want the /platform-admin console's in-app "Provision" button to work -
  # a DSN with credentials but NO database name. Leave this key out of the Secret entirely to
  # disable in-app provisioning (see docs/DEPLOYMENT.md's "Provisioning without the automation").
  TENANT_DB_PROVISION_BASE_URL: "mysql://root:CHANGE_ME@release-name-timesphere-mysql:3306"
  JWT_ACCESS_SECRET: "CHANGE_ME_run_openssl_rand_base64_48"
  JWT_REFRESH_SECRET: "CHANGE_ME_run_openssl_rand_base64_48"
  PLATFORM_ADMIN_JWT_SECRET: "CHANGE_ME_run_openssl_rand_base64_48"
  ENCRYPTION_KEY: "CHANGE_ME_64_hex_chars_run_openssl_rand_hex_32"
  # Only read by the mysql StatefulSet when mysql.enabled=true - harmless to leave set
  # otherwise.
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_run_openssl_rand_hex_32"
  # Optional - AI features (auto-triage, chat/email intake, etc.) stay off without this.
  ANTHROPIC_API_KEY: ""
