{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "timesphere.fullname" . }}
  labels:
    {{- include "timesphere.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
        {{- if .Values.ingress.wildcardHost }}
        - {{ .Values.ingress.wildcardHost | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range (list .Values.ingress.host .Values.ingress.wildcardHost) }}
    {{- if . }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "timesphere.fullname" $ }}-api
                port:
                  name: http
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: {{ include "timesphere.fullname" $ }}-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "timesphere.fullname" $ }}-web
                port:
                  name: http
    {{- end }}
    {{- end }}
{{- end }}
