{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # A fixed name (not release-revision-suffixed) plus hook-delete-policy below means each
  # upgrade cleanly replaces the previous run's Job instead of accumulating one per release.
  name: {{ include "timesphere.fullname" . }}-migrate
  labels:
    {{- include "timesphere.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # post-install + pre-upgrade, and the asymmetry is the point:
    #
    # An earlier revision used pre-install here, and its documented recovery ("run `helm
    # upgrade` once MySQL's pod is Ready") was impossible to follow on the one path it existed
    # for - a FAILED pre-install hook aborts the install before the chart's non-hook resources
    # are ever created, so with mysql.enabled=true there was no MySQL to become Ready and no
    # first install could ever succeed. Found by actually running the documented first-install
    # path on a fresh cluster, which is how a chart bug of this shape has to be found.
    #
    # post-install runs AFTER the resources exist: MySQL starts, the init container below waits
    # for it, migrations run, and the api pods (which crash-restart until the schema exists -
    # that is what a readiness probe and restartPolicy are for) come up on their next restart.
    # Upgrades keep the stricter ordering: pre-upgrade migrates the schema BEFORE the new code
    # rolls out, so a pod never serves requests against a schema older than it expects.
    # External-MySQL deployments (mysql.enabled=false, the recommended production setup) work
    # identically on both paths, since their database exists before Helm ever runs.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "timesphere.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- if .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      {{- if .Values.mysql.enabled }}
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              until nc -z -w2 {{ include "timesphere.fullname" . }}-mysql 3306; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then
                  echo "Timed out waiting for MySQL - see this Job's annotation for the known first-install ordering caveat." >&2
                  exit 1
                fi
                echo "Waiting for MySQL... ($i/60)"
                sleep 5
              done
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "timesphere.image" (dict "root" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          command:
            - sh
            - -c
            - |
              npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && \
              npx prisma migrate deploy --schema=apps/api/prisma/control/schema.prisma
          envFrom:
            - configMapRef:
                name: {{ include "timesphere.fullname" . }}-config
            - secretRef:
                name: {{ .Values.existingSecretName }}
{{- end }}
