apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "timesphere.fullname" . }}-api
  labels:
    {{- include "timesphere.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "timesphere.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "timesphere.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- if .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "timesphere.image" (dict "root" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: {{ include "timesphere.fullname" . }}-config
            - secretRef:
                name: {{ .Values.existingSecretName }}
          {{- if .Values.telemetry.enabled }}
          # Downward API rather than the ConfigMap: these differ per POD, and a ConfigMap is one
          # object shared by every replica. Without them the telemetry rows still record the
          # hostname (which is the pod name on Kubernetes), but the per-pod breakdown cannot
          # distinguish a namespace or survive a hostname convention change.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "timesphere.fullname" . }}-api-uploads
