apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "timesphere.fullname" . }}-config
  labels:
    {{- include "timesphere.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.env.nodeEnv | quote }}
  TZ: {{ .Values.env.tz | quote }}
  DEFAULT_ORG_SLUG: {{ .Values.env.defaultOrgSlug | quote }}
  ROOT_DOMAIN: {{ .Values.env.rootDomain | quote }}
  MYSQLDUMP_PATH: {{ .Values.env.mysqldumpPath | quote }}
  WEB_ORIGIN: {{ .Values.env.webOrigin | quote }}
  APP_BASE_URL: {{ .Values.env.appBaseUrl | quote }}
  API_PORT: "4000"
  UPLOAD_DIR: "/app/uploads"
  # Hop count, not a boolean — see values.yaml's env.trustProxyHops. Left out of the ConfigMap,
  # env.ts defaults it to 0 and every per-IP rate limit behind the ingress becomes one bucket.
  TRUST_PROXY_HOPS: {{ .Values.env.trustProxyHops | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.env.rateLimitPerMinute | quote }}
  # SSRF guard on the four admin-configurable outbound URLs — see values.yaml and
  # apps/api/src/utils/egress.ts. A cluster deployment is the case where leaving this open
  # matters most: the pod can reach the cloud metadata endpoint and every ClusterIP service.
  ALLOW_PRIVATE_NETWORK_EGRESS: {{ .Values.env.allowPrivateNetworkEgress | quote }}
  TENANT_DB_CONNECTION_LIMIT: {{ .Values.env.tenantDbConnectionLimit | quote }}
  ACCESS_TOKEN_TTL: {{ .Values.env.accessTokenTtl | quote }}
  REFRESH_TOKEN_TTL_DAYS: {{ .Values.env.refreshTokenTtlDays | quote }}
  {{- with .Values.mail }}
  # Outbound SMTP. GlobalMailSettings in the tenant database overrides all of this at runtime; these
  # are the deployment-level fallback. Empty SMTP_HOST = mail is written to stdout instead of sent,
  # which is a real trap on Kubernetes (a "delivered" password reset that only reached kubectl logs).
  # SMTP_PASS is absent on purpose — it comes from the Secret, not from here.
  MAIL_FROM: {{ .from | quote }}
  SMTP_HOST: {{ .smtpHost | quote }}
  SMTP_PORT: {{ .smtpPort | quote }}
  SMTP_USER: {{ .smtpUser | quote }}
  SMTP_SECURE: {{ .smtpSecure | quote }}
  {{- end }}
  {{- with .Values.sla }}
  # Approval + ticket SLA escalation. The cron values are scan frequency, the hours are deadlines.
  SLA_ENABLED: {{ .enabled | quote }}
  SLA_CRON_SCHEDULE: {{ .cronSchedule | quote }}
  SLA_DEFAULT_APPROVAL_HOURS: {{ .defaultApprovalHours | quote }}
  TICKET_SLA_ENABLED: {{ .ticketEnabled | quote }}
  TICKET_SLA_CRON_SCHEDULE: {{ .ticketCronSchedule | quote }}
  TICKET_SLA_LOW_HOURS: {{ .ticketLowHours | quote }}
  TICKET_SLA_MEDIUM_HOURS: {{ .ticketMediumHours | quote }}
  TICKET_SLA_HIGH_HOURS: {{ .ticketHighHours | quote }}
  TICKET_SLA_CRITICAL_HOURS: {{ .ticketCriticalHours | quote }}
  {{- end }}
  {{- with .Values.updateCheck }}
  # UPDATE_CHECK is read as the literal string "off" to disable — anything else leaves it on, so the
  # boolean is mapped rather than passed through (a bare "false" here would NOT switch it off).
  UPDATE_CHECK: {{ ternary "on" "off" .enabled | quote }}
  {{- if .repo }}
  UPDATE_CHECK_REPO: {{ .repo | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.storage }}
  # Empty = the default layout under UPLOAD_DIR above. A path set here must land inside a mounted
  # volume; api-deployment.yaml mounts the uploads PVC at /app/uploads and nothing else.
  STORAGE_ROOT: {{ .root | quote }}
  STORAGE_DOCUMENTS_DIR: {{ .documentsDir | quote }}
  STORAGE_AVATARS_DIR: {{ .avatarsDir | quote }}
  STORAGE_FACE_DIR: {{ .faceDir | quote }}
  {{- end }}
  {{- with .Values.logging }}
  # Empty dir = console only, which is what `kubectl logs` and cluster log shippers read.
  LOG_DIR: {{ .dir | quote }}
  LOG_ROTATE_HOURS: {{ .rotateHours | quote }}
  LOG_RETENTION_DAYS: {{ .retentionDays | quote }}
  LOG_COMPRESS_ON_ROLLOVER: {{ .compressOnRollover | quote }}
  {{- end }}
  {{- with .Values.telemetry }}
  # API request telemetry — see docs/DEPLOYMENT.md → "Operating API request telemetry".
  # Recording is off unless `telemetry.enabled` is set, so these are inert by default. Pod and
  # cluster identity are NOT here: POD_NAME/POD_NAMESPACE come from the downward API on the
  # Deployment itself (a ConfigMap cannot know which pod reads it), and CLUSTER_NAME is the one
  # value Kubernetes cannot tell us about itself.
  API_TELEMETRY_ENABLED: {{ .enabled | quote }}
  API_TELEMETRY_SAMPLE_RATE: {{ .sampleRate | quote }}
  API_TELEMETRY_FLUSH_MS: {{ .flushMs | quote }}
  API_TELEMETRY_MAX_BUFFER: {{ .maxBuffer | quote }}
  API_TELEMETRY_RETENTION_DAYS: {{ .retentionDays | quote }}
  CLUSTER_NAME: {{ .clusterName | quote }}
  {{- end }}
