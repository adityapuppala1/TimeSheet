{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "timesphere.fullname" . }}-api
  labels:
    {{- include "timesphere.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "timesphere.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.api.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- if .Values.api.verticalAutoscaling.enabled }}
---
# Requires the VPA CRDs (kubectl get crd verticalpodautoscalers.autoscaling.k8s.io) - not every
# cluster has these installed, which is why this whole block stays off by default (see
# values.yaml's comment). VPA and HPA both reacting to CPU on the same workload can fight each
# other; if you enable this, scope the HPA above to a metric VPA doesn't touch (e.g. custom
# request-rate) or disable one of them.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "timesphere.fullname" . }}-api
  labels:
    {{- include "timesphere.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "timesphere.fullname" . }}-api
  updatePolicy:
    updateMode: {{ .Values.api.verticalAutoscaling.updateMode | quote }}
{{- end }}
