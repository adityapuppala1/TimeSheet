apiVersion: v2
name: timesphere
description: >-
  TimeSphere - timesheet, ticketing, and AI-assisted operations platform. One chart serves both
  deployment shapes described in docs/DEPLOYMENT.md: a single-org install (mysql.enabled=true,
  one ingress host, DEFAULT_ORG_SLUG resolves every request) or a multi-org SaaS install
  (external managed MySQL recommended, wildcard ingress host for subdomain-per-org routing).
type: application
version: 0.1.1
# Tracks the repo-root VERSION file. Surfaces only as the `app.kubernetes.io/version` label and in
# NOTES.txt — it does NOT select an image tag (that is `image.tag` in values.yaml, `latest` by
# default), so bumping it cannot change what a cluster actually runs.
appVersion: "2.1.0"
keywords:
  - timesheet
  - ticketing
  - saas
  - multi-tenant
