# Default values for the timesphere chart. Override with -f my-values.yaml or --set.
# See docs/DEPLOYMENT.md's "Kubernetes deployment" section for the full walkthrough.

image:
  # Matches .github/workflows/cd.yml's naming: ghcr.io/<owner>/<repo>-api and -web.
  # Swap registry/repository if you publish elsewhere (ECR/GCR/ACR/Docker Hub).
  registry: ghcr.io
  repository: your-org/your-repo
  tag: latest
  pullPolicy: IfNotPresent
  pullSecretName: ""

# The Secret (created by you, NOT this chart - see secrets.example.yaml) holding every value
# apps/api/src/config/env.ts requires with no default: DATABASE_URL, CONTROL_DATABASE_URL,
# JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, PLATFORM_ADMIN_JWT_SECRET, ENCRYPTION_KEY, and
# (if mysql.enabled) MYSQL_ROOT_PASSWORD. Keeping secret creation out of `helm install` is
# deliberate - a chart value or a `helm history` entry is not where long-lived credentials
# belong; use your cluster's actual secret manager (sealed-secrets, External Secrets, Vault, or
# plain `kubectl create secret` for a first pass) and just point this chart at the result.
existingSecretName: timesphere-secrets

api:
  replicaCount: 2
  # The memory limit is sized for FACE VERIFICATION, not for an idle API, and that is why it looks
  # generous. face.service.ts loads the Human/TensorFlow models into the Node process on first use
  # (or at boot, if any org has face verification enabled) and they cost roughly 500MB resident.
  # The previous 512Mi limit was under that on its own: any deployment that switched the feature on
  # got pods OOMKilled mid-verification, which reads as a flaky camera rather than as a resource
  # limit. Requests stay low because the cost is only paid by deployments that use the feature —
  # the scheduler should not reserve 1Gi on every node for something most installs leave off.
  # Face verification OFF and staying off: 512Mi is genuinely enough, and lowering it back is a
  # reasonable saving on a large fleet.
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 1280Mi }
  # Real autoscaling - this is the capability docker-compose.yml has no equivalent for (its one
  # manual lever is `docker compose up --scale api=N`). HPA here reacts to load automatically.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # VerticalPodAutoscaler is a separate CRD not every cluster has installed - left off by
  # default so a plain `helm install` never fails on a missing CRD. Turn on only after
  # `kubectl get crd verticalpodautoscalers.autoscaling.k8s.io` confirms it's present.
  verticalAutoscaling:
    enabled: false
    updateMode: "Off" # Off | Initial | Auto
  # A ReadWriteOnce PVC, mounted by every api pod - fine for a single node or a storage class
  # that happens to co-locate them, but ticket/timesheet attachments won't be visible across
  # nodes with a real multi-node HPA fleet unless your storage class supports ReadWriteMany
  # (most cloud block storage doesn't; NFS/EFS/Azure Files do). For genuine horizontal scaling
  # in production, point UPLOAD_DIR-equivalent storage at S3-compatible object storage instead -
  # not something this chart does for you yet.
  uploadsVolumeSize: 10Gi

web:
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# Self-hosted MySQL via a StatefulSet - fine for Shape 1 (on-prem/single-org) or evaluation.
# For Shape 2 (SaaS, many tenant databases) a managed MySQL service (RDS/Cloud SQL/Azure
# Database for MySQL) is strongly recommended instead: set mysql.enabled=false and point
# DATABASE_URL/CONTROL_DATABASE_URL/TENANT_DB_PROVISION_BASE_URL in your Secret at it.
mysql:
  enabled: true
  image: mysql:8.4
  storageSize: 20Gi
  storageClassName: ""
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }

ingress:
  enabled: true
  className: nginx
  # Shape 1: a single real hostname. Shape 2: also set wildcardHost for subdomain-per-org
  # routing (middleware/tenant.ts resolves org purely from the Host header's subdomain).
  host: timesphere.example.com
  wildcardHost: ""
  tls:
    enabled: true
    secretName: timesphere-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ingress-nginx defaults proxy-body-size to 1m, exactly like plain nginx — and every browser
    # upload reaches the api through this ingress. Left at the default, attachments over 1MB die
    # at the controller with a bare 413 and the api never sees them, so the app's own readable
    # size/type error never fires. Matches apps/web/nginx.conf.template's client_max_body_size:
    # 8 x 25MB (middleware/upload.ts's real ceiling) plus multipart framing. multer stays the
    # enforcer — it is the layer that can name which file was rejected and why.
    # NOTE: this annotation is ingress-nginx-specific. On Traefik use a buffering middleware; on
    # an AWS ALB / GCE ingress there is no body-size cap to lift in the first place.
    nginx.ingress.kubernetes.io/proxy-body-size: 210m

# Non-secret environment - everything with a default in env.ts is safe to leave unset here.
env:
  nodeEnv: production
  defaultOrgSlug: default
  # Shape 2 only. The apex every workspace hangs off (acme.<rootDomain>); pair it with
  # ingress.wildcardHost "*.<rootDomain>" and a wildcard TLS certificate, or subdomains will never
  # reach the pods. Empty = single-org install.
  rootDomain: ""
  # Only read when the retention programme's snapshot directory is set. The api image does not ship
  # mysqldump, so leave this empty unless you have added the client to your own image — a snapshot
  # that cannot be taken is recorded, and never blocks the deletion it was meant to precede.
  mysqldumpPath: ""
  webOrigin: https://timesphere.example.com
  appBaseUrl: https://timesphere.example.com
  tz: Asia/Kolkata
  # Number of reverse proxies in front of the api pods. 1 is correct for this chart as shipped:
  # ingress.yaml routes /api straight to the api Service, so the ingress controller is the single
  # hop. Add one for anything in front of it (Cloudflare, an external LB terminating TLS) and set
  # it to 0 if you disable the ingress and expose the Service directly.
  #
  # It is a hop COUNT, not a boolean, because trusting X-Forwarded-For wholesale lets any caller
  # forge req.ip — and req.ip is what every per-IP rate limit in the app reads. Wrong-low means
  # one shared global bucket for every user; wrong-high means a forgeable one.
  trustProxyHops: 1
  # Per-IP blanket request budget per minute. Raise for deployments where many real users share
  # one egress IP (office NAT, corporate proxy) — the per-surface limiters (auth, public shares,
  # webhooks) stay fixed regardless. Default matches what the code has always shipped.
  rateLimitPerMinute: 900
  # May the API fetch private / loopback / link-local addresses? Four features let a workspace
  # admin type a URL the server then requests (outbound webhooks, the Google Chat webhook, Bot
  # Framework replies, the BYOK AI base URL), so an unrestricted one is SSRF from inside the
  # cluster: the node metadata endpoint (169.254.169.254 — IAM credentials), any ClusterIP
  # service, the MySQL StatefulSet. FALSE is correct for essentially every cluster install;
  # flip it only if a webhook receiver genuinely lives on an internal address.
  allowPrivateNetworkEgress: false
  # Connections per tenant Prisma client. The code default (5) is multi-tenant arithmetic —
  # 50 cached tenant clients x 5 must stay under MySQL max_connections. A Shape-1 single-org
  # install has ONE live tenant, and load testing showed 5 caps the authed path near 90 req/s
  # purely on pool queueing. 20 is the single-org default; SaaS multi-tenant fleets should
  # lower it back toward 5 and mind the ceiling arithmetic in config/prisma.ts.
  tenantDbConnectionLimit: 20
  # Access/refresh token lifetimes. Same defaults env.ts applies; surfaced here because they are
  # the two knobs a security review actually asks about, and "it is not in values.yaml" is a poor
  # answer to "can you shorten the access token TTL?".
  accessTokenTtl: 15m
  refreshTokenTtlDays: 14

# Outbound email. This was MISSING from the chart entirely — the ConfigMap carried no SMTP keys and
# the Secret example carried no password, so a Kubernetes install had no way to configure mail
# through Helm at all. It did not fail loudly either: mail.service.ts falls back to logging each
# message to stdout when no host is configured, so password resets and digests were "sent"
# straight into `kubectl logs` and nowhere else.
#
# Precedence, worth knowing before filling this in: GlobalMailSettings in the TENANT DATABASE wins
# over all of this. These values are the deployment-level fallback for a workspace that has not
# configured Workspace Settings → Mail server. Leaving host empty keeps the console-only behaviour.
#
# SMTP_PASS is deliberately NOT here — it belongs in the Secret alongside the other credentials
# (see secrets.example.yaml). A password in values.yaml lands in `helm get values` and `helm history`.
mail:
  from: "TimeSphere <no-reply@timesphere.example.com>"
  smtpHost: ""
  smtpPort: 587
  smtpUser: ""
  # false = STARTTLS on 587 (the common case, including Microsoft 365). true = implicit TLS on 465.
  smtpSecure: false

# Approval and ticket SLA escalation. Also previously absent from the chart, which meant a
# Kubernetes deployment could not turn escalation off or retune it without editing the ConfigMap by
# hand — while both compose files exposed most of it. The cron schedules are how often the workers
# SCAN; the hour values are the deadlines they measure against.
sla:
  # Timesheet approval escalation.
  enabled: true
  cronSchedule: "*/15 * * * *"
  defaultApprovalHours: 48
  # Ticket resolution deadlines by priority, in hours.
  ticketEnabled: true
  ticketCronSchedule: "*/15 * * * *"
  ticketLowHours: 168
  ticketMediumHours: 72
  ticketHighHours: 24
  ticketCriticalHours: 4

# The hourly GitHub release check behind the What's-new page.
# Set enabled: false for an air-gapped cluster — the page then shows the release history bundled in
# the image's own CHANGELOG.md instead of calling out, and nothing retries in the background.
# repo: override for a fork. A PRIVATE repo additionally needs a read-only Contents PAT, which goes
# in the Secret as UPDATE_CHECK_TOKEN (anonymous release lookups 404 on a private repo).
updateCheck:
  enabled: true
  repo: ""

# Relocatable, segregated file storage (docs/DEPLOYMENT.md → "Relocating file storage").
# EMPTY = unchanged: everything lives under UPLOAD_DIR (/app/uploads), which is the PVC this
# chart already mounts. Any path set here must resolve INSIDE a mounted volume — the api
# container's filesystem is otherwise ephemeral, so a file written elsewhere dies with the pod.
storage:
  root: ""
  documentsDir: ""
  avatarsDir: ""
  faceDir: ""

# Rotating file logs. Empty logDir = OFF, which is the right default on Kubernetes: stdout is
# what `kubectl logs` and every cluster log shipper already collect, and files inside a pod are
# lost on restart. Set logDir only when it points at a mounted, retained volume.
logging:
  dir: ""
  rotateHours: 4
  retentionDays: 30
  compressOnRollover: true

# API request telemetry — per-request latency/DB-time samples behind Workspace Settings →
# Maintenance → "API performance". See docs/DEPLOYMENT.md → "Operating API request telemetry".
#
# OFF by default: this middleware runs in the hot path of every request and writes a row per
# sampled one, into EVERY tenant database. Enabling it also turns on the downward-API pod
# identity on the api Deployment, so switching it on triggers a pod restart.
# On a busy cluster turn sampleRate DOWN rather than the feature off — percentiles from a 10%
# sample are still percentiles.
telemetry:
  enabled: false
  sampleRate: 1 # 0..1 — fraction of requests recorded
  flushMs: 5000 # how often the in-memory buffer drains to the database
  maxBuffer: 5000 # past this, samples are dropped (and counted), never queued unbounded
  retentionDays: 14 # pruned nightly at 04:10; rows accumulate with traffic
  clusterName: "" # free text; Kubernetes cannot report its own cluster name

# Runs `prisma migrate deploy` against BOTH schemas as a Helm hook Job before the api
# Deployment rolls out new pods - the Kubernetes equivalent of docker-compose.yml's inline
# migrate-then-start command, but as its own short-lived Job rather than baked into every
# container's startup (so a failed migration blocks the rollout instead of half-succeeding).
migrationJob:
  enabled: true
  backoffLimit: 2
