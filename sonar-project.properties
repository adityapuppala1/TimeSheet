# SonarQube / SonarCloud configuration.
#
# WHY THE QUALITY GATE SHOULD BE "NEW CODE ONLY": scanning ~100k lines retroactively produces a
# five-figure issue count that nobody triages, and a permanently-red dashboard is one people learn
# to ignore — the same failure mode as an `npm audit` that always has findings. Gating NEW code
# (coverage on changed lines, zero new blockers/criticals) is a rule a team can actually hold, and
# the debt burns down as files get touched. Set that in the Sonar project's own settings; it is a
# server-side setting, not something this file can express.
#
# TO RUN LOCALLY:
#   npm run test:coverage -w apps/api   # writes apps/api/coverage/lcov.info
#   npx sonar-scanner -Dsonar.token=<token> -Dsonar.host.url=<url>
#
# This file deliberately does NOT add a scanner step to .github/workflows/ci.yml — that needs a
# server URL and a token, which are decisions for whoever owns the Sonar instance. CI already runs
# CodeQL and Semgrep (the `security-scan-dogfood` job) plus a blocking `npm audit` gate, so nothing
# here is a prerequisite for shipping.

sonar.projectKey=timesphere
sonar.projectName=TimeSphere
sonar.projectVersion=1.0.0

# Only real source. Generated Prisma clients, build output and vendored skill docs would otherwise
# dominate the issue count with code nobody in this repo can fix — the same reasoning as
# .graphifyignore.
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/tests,tests/e2e
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/generated/**,\
  **/*.generated.ts,\
  apps/api/src/generated/**,\
  apps/web/public/**,\
  graphify-out/**,\
  .agents/**

# Vitest writes lcov here; without this Sonar reports 0% and every new-code coverage gate fails.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
# One entry per workspace — this is a monorepo with no root tsconfig, and pointing at a file that
# doesn't exist makes the scanner fall back to a weaker parse with no type information, silently.
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.json,packages/shared/tsconfig.json

# Test files legitimately repeat setup blocks and fixture literals; flagging that as duplication
# produces noise that trains people to dismiss the duplication rule everywhere else.
sonar.cpd.exclusions=apps/api/tests/**,tests/e2e/**
